<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>enjambre — pantalla</title>
<!-- D20 punto 6: fuente VT323 (Google Fonts) para el panel de bitácora e
     inventario que sale del lienzo. Si la red no la trae (offline, bloqueo
     de terceros), la hoja de abajo cae a monospace vía
     font-family: "VT323", monospace -- nunca una fuente sin servir rompe el
     panel, solo cambia su aspecto. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0f14; /* fondo explícito del body, pedido por el plan */
    color: #e8e0c8;
    font-family: "Courier New", "DejaVu Sans Mono", monospace;
    font-size: 14px;
  }
  /* Cualquier regla de autor con `display` explícito (.zona-lienzo,
     .controles...) pisa el `[hidden]{display:none}` de la hoja por defecto
     del navegador -- es la propia cascada CSS (origen de autor > agente de
     usuario, con independencia de especificidad), no un despiste de cada
     clase suelta. Una sola regla aquí, con la máxima prioridad posible,
     resuelve el problema para TODO el documento de una vez (encontrado
     probando el modo directo, Tarea 12: `controles.hidden = true` no
     ocultaba nada pese a aplicarse). */
  [hidden] {
    display: none !important;
  }
  body {
    padding: 8px;
    box-sizing: border-box;
    min-height: 100vh;
  }
  header.cabecera {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 6px 8px;
    margin-bottom: 8px;
    background: #1a2230;
    border: 1px solid #333c4a;
    border-radius: 4px;
  }
  header.cabecera .campo {
    white-space: nowrap;
  }
  header.cabecera strong {
    color: #f2d06b;
  }
  main {
    width: 100%;
  }
  .lista-runs ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .lista-runs li {
    padding: 4px 0;
    border-bottom: 1px solid #222a35;
  }
  .lista-runs a {
    color: #8fd0e8;
    text-decoration: none;
    margin-right: 6px;
  }
  .lista-runs a:hover {
    text-decoration: underline;
  }
  .zona-lienzo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .lienzo-wrap {
    /* El contenedor no fija tamaño: escena.js pone el width/height en px
       del propio <canvas>, calculado al mayor entero que quepa. */
    max-width: 100%;
    overflow: auto;
  }
  #lienzo {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border: 1px solid #333c4a;
  }
  .controles {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 320px;
  }
  .controles button {
    background: #1a2230;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 4px 8px;
    font-family: inherit;
    cursor: pointer;
  }
  .controles button.activo {
    border-color: #f2d06b;
    color: #f2d06b;
  }
  .controles input[type="range"] {
    flex: 1 1 auto;
    min-width: 80px;
  }
  .aviso-directo {
    width: 100%;
    max-width: 320px;
    text-align: center;
    color: #e8c84a;
  }
  .aviso-directo a {
    color: #8fd0e8;
  }
  .panel-lateral {
    position: fixed;
    top: 0;
    right: 0;
    width: min(360px, 100vw);
    height: 100vh;
    background: #141b24;
    border-left: 1px solid #333c4a;
    padding: 8px;
    box-sizing: border-box;
    overflow: auto;
  }
  .panel-lateral button {
    background: #1a2230;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 2px 8px;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .panel-lateral pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }
  /* 360px de ancho sin scroll horizontal (plan, Tarea 10): nada aquí fija
     un ancho mayor que 100vw; el lienzo se escala por JS a ×1 cuando no cabe
     a ×3/×4 (ver escena.js:_escalarLienzo). */

  /* D20 punto 6: bitácora e inventario, antes dentro del lienzo (Tarea 11),
     ahora un panel HTML normal debajo -- por eso usan su propia fuente
     (VT323, más legible a tamaño de texto real que la fuente de mapa de
     bits de 5×7, pensada para 320px de lienzo) en vez de la del canvas. */
  .panel-registro {
    width: 100%;
    max-width: 640px;
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-family: "VT323", monospace;
    font-size: 18px;
    line-height: 1.25;
  }
  .panel-registro > div {
    flex: 1 1 260px;
    min-width: 220px;
    background: #1a2230;
    border: 1px solid #333c4a;
    border-radius: 4px;
    padding: 6px 8px;
    box-sizing: border-box;
  }
  .panel-registro h2 {
    margin: 0 0 4px;
    font-size: 16px;
    font-family: "Courier New", "DejaVu Sans Mono", monospace; /* cabeceras con la fuente normal, el contenido con VT323 */
    color: #f2d06b;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .panel-registro ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  /* Bitácora: líneas completas, sin recorte (a diferencia del lienzo de
     320px) -- se envuelven si no caben. */
  #lista-bitacora li {
    white-space: normal;
    word-break: break-word;
    border-bottom: 1px solid #222a35;
    padding: 1px 0;
  }
  #lista-inventario li {
    border-bottom: 1px solid #222a35;
    padding: 1px 0;
  }
  .item-inventario {
    background: none;
    border: none;
    color: #8fd0e8;
    font-family: inherit;
    font-size: inherit;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    text-align: left;
    word-break: break-all;
  }
  .item-inventario:hover {
    color: #c9a0e8;
  }
</style>
</head>
<body>
<header id="cabecera" class="cabecera"></header>

<main>
  <div id="lista-runs" class="lista-runs"></div>

  <div id="zona-lienzo" class="zona-lienzo" hidden>
    <div class="lienzo-wrap">
      <canvas id="lienzo" width="320" height="200"></canvas>
    </div>

    <div id="controles" class="controles">
      <button id="btn-pausa" type="button">Pausa</button>
      <button type="button" data-vel="1">×1</button>
      <button type="button" data-vel="4">×4</button>
      <button type="button" data-vel="16">×16</button>
      <input id="barra" type="range" min="0" max="0" value="0" />
    </div>

    <div id="aviso-directo" class="aviso-directo" hidden></div>

    <!-- D20 punto 6: bitácora e inventario fuera del lienzo. Las rellena
         escena.js (_actualizarBitacora/_actualizarInventario) cada vez que
         se repinta el lienzo, con el mismo `estado` -- nunca quedan
         desincronizados entre sí. -->
    <div id="panel-registro" class="panel-registro">
      <div>
        <h2>Bitácora</h2>
        <ul id="lista-bitacora"></ul>
      </div>
      <div>
        <h2>Inventario</h2>
        <ul id="lista-inventario"></ul>
      </div>
    </div>
  </div>
</main>

<aside id="panel-lateral" class="panel-lateral" hidden>
  <button id="cerrar-panel" type="button">cerrar</button>
  <pre id="panel-contenido"></pre>
</aside>

<script type="module">
  import { arrancar } from "/static/escena.js";
  arrancar(document.getElementById("lienzo"), document.getElementById("cabecera"));
</script>
</body>
</html>
