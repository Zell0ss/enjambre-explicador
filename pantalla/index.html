<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>enjambre — pantalla</title>
<!-- D20/D22 punto 6: fuente VT323 (Google Fonts) para todo el texto de la
     mesa (tarjetas, "Ahora", bitácora, puertas) -- ya no hay texto dibujado
     a mano en un <canvas>, solo HTML normal. Si la red no la trae (offline,
     bloqueo de terceros), la hoja de abajo cae a monospace vía
     font-family: "VT323", monospace -- nunca una fuente sin servir rompe la
     mesa, solo cambia su aspecto. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0f14; /* fondo explícito del body, pedido por el plan */
    color: #e8e0c8;
    font-family: "Courier New", "DejaVu Sans Mono", monospace;
    font-size: 14px;
  }
  /* Cualquier regla de autor con `display` explícito pisa el
     `[hidden]{display:none}` de la hoja por defecto del navegador -- una
     sola regla aquí, con la máxima prioridad posible, resuelve el problema
     para TODO el documento de una vez (Tarea 12). */
  [hidden] {
    display: none !important;
  }
  body {
    padding: 8px;
    box-sizing: border-box;
    min-height: 100vh;
  }
  header.cabecera {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 6px 8px;
    margin-bottom: 8px;
    background: #1a2230;
    border: 1px solid #333c4a;
    border-radius: 4px;
  }
  header.cabecera .campo {
    white-space: nowrap;
  }
  header.cabecera strong {
    color: #f2d06b;
  }
  header.cabecera .volver {
    color: #8fd0e8;
    text-decoration: none;
  }
  header.cabecera .volver:hover {
    text-decoration: underline;
  }
  /* D24 (Tarea 17): "Continuar" -- mismos tonos que .form-lanzar, dentro de
     la cabecera en vez de debajo porque solo tiene sentido viendo un run
     parado, nunca en la portada. */
  header.cabecera .continuar {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: normal;
  }
  header.cabecera .continuar label {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  header.cabecera .continuar input {
    width: 56px;
    background: #0b0f14;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 2px 4px;
    font-family: inherit;
    font-size: inherit;
  }
  header.cabecera .continuar button {
    background: #1e3a2a;
    color: #a9e88f;
    border: 1px solid #2a5a3a;
    border-radius: 3px;
    padding: 3px 8px;
    font-family: inherit;
    cursor: pointer;
  }
  header.cabecera .continuar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  header.cabecera .error-continuar {
    color: #ff6b6b;
  }
  main {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .lista-runs ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .lista-runs li {
    padding: 4px 0;
    border-bottom: 1px solid #222a35;
  }
  .lista-runs a {
    color: #8fd0e8;
    text-decoration: none;
    margin-right: 6px;
  }
  .lista-runs a:hover {
    text-decoration: underline;
  }

  /* ------------------------------------------------------------------- *
   * D22: la mesa de papeles -- rejilla de 4 columnas en el orden del
   * flujo (Tarea 16, §5.5). Sustituye por completo al <canvas> de escena
   * única (D20) y a los bocadillos/loro/panel de inventario aparte.
   * ------------------------------------------------------------------- */
  .zona-mesa {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }
  .mesa-wrap {
    position: relative;
  }
  .mesa {
    display: grid;
    /* Retoque Tarea 16 (2): columna 4 es una espaciadora vacía (sin
       ninguna tarjeta dentro) entre trazador/redactor (3) y
       verificador/novato (ahora 5) -- da sitio a la etiqueta "vuelta
       n/max" y a los cuatro codos de ida/vuelta de mesa.js
       (`_recalcularFlechas`) sin pisar ninguna tarjeta. Las coordenadas
       siguen leyéndose del DOM (nunca un número fijo en mesa.js): esto
       solo decide CUÁNTO sitio hay, no dónde caen las líneas. */
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 110px minmax(0, 1fr);
    gap: 30px 44px;
    align-items: start;
  }
  /* Posiciones lógicas de rejilla (punto 1): cartógrafo arriba/despiezador
     abajo en la columna 1; lectores en la 2, ocupando las dos filas;
     trazador/redactor en la 3; verificador/novato en la 5 (la 4 es la
     espaciadora de arriba). */
  .carta[data-rol="cartografo"] { grid-column: 1; grid-row: 1; }
  .carta[data-rol="despiezador"] { grid-column: 1; grid-row: 2; }
  .carta[data-rol="lector-de-pieza"] { grid-column: 2; grid-row: 1 / 3; }
  .carta[data-rol="trazador"] { grid-column: 3; grid-row: 1; }
  .carta[data-rol="redactor"] { grid-column: 3; grid-row: 2; }
  .carta[data-rol="verificador"] { grid-column: 5; grid-row: 1; }
  .carta[data-rol="novato"] { grid-column: 5; grid-row: 2; }

  .carta {
    position: relative;
    z-index: 2;
    background: #1a2230;
    border: 2px solid #333c4a;
    border-radius: 4px;
    padding: 8px;
    box-sizing: border-box;
    font-family: "VT323", monospace;
    font-size: 16px;
    line-height: 1.2;
  }
  /* Borde resaltado si leyendo/escribiendo; rojo si bloqueado (punto 2). */
  .carta--activa {
    border-color: #f2d06b;
    box-shadow: 0 0 6px rgba(242, 208, 107, 0.4);
  }
  .carta--bloqueada {
    border-color: #c23b3b;
    box-shadow: 0 0 6px rgba(194, 59, 59, 0.5);
  }
  .carta-titulo {
    margin: 0 0 6px;
    font-size: 15px;
    font-family: "Courier New", "DejaVu Sans Mono", monospace;
    color: #f2d06b;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .carta-subtitulo {
    color: #8fa0b8;
    text-transform: none;
    letter-spacing: normal;
    font-size: 12px;
  }
  .carta-cabeza {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .carta-sprite,
  .fila-lector-sprite {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex: 0 0 auto;
    background: #0a0e1a;
  }
  .carta-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .carta-estado {
    color: #e8e0c8;
  }
  .carta-modelo {
    color: #8fa0b8;
    font-size: 13px;
  }
  .carta-fin {
    color: #a9e88f;
    font-size: 13px;
  }
  .carta-ahora {
    margin-top: 6px;
    min-height: 1.3em;
    word-break: break-word;
  }
  .carta-fichas,
  .fila-lector-fichas {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
  }
  .carta-fichas li,
  .fila-lector-fichas li {
    padding: 1px 0;
  }
  .ficha {
    background: none;
    border: none;
    color: #8fd0e8;
    font-family: inherit;
    font-size: inherit;
    text-decoration: underline;
    cursor: pointer;
    padding: 1px 2px;
    text-align: left;
    word-break: break-all;
  }
  .ficha:hover {
    color: #c9a0e8;
  }
  /* Punto 4: "el papel se enciende" cuando se ha leído hace poco. */
  .ficha--encendida {
    background: rgba(242, 208, 107, 0.25);
    color: #f2e08a;
    border-radius: 2px;
  }

  /* Tarjeta de lectores (punto 3): filas dentro, sprite ×2. */
  .carta-lectores {
    display: flex;
    flex-direction: column;
  }
  .filas-lectores {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 560px;
    overflow-y: auto;
  }
  .fila-lector {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    border-top: 1px solid #222a35;
    padding-top: 4px;
  }
  .fila-lector:first-child {
    border-top: none;
    padding-top: 0;
  }
  .fila-lector--activa {
    outline: 1px solid #f2d06b;
  }
  .fila-lector--bloqueada {
    outline: 1px solid #c23b3b;
  }
  .fila-lector-datos {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .fila-lector-estado {
    font-size: 13px;
    color: #8fa0b8;
  }

  /* Flechas SVG (punto 1): overlay sobre la rejilla, nunca intercepta
     clics (pointer-events:none) -- recalculadas por mesa.js a partir de
     la posición real de las tarjetas. */
  .flechas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }
  .flecha-ida {
    fill: none;
    stroke: #7a8aa0;
    stroke-width: 2;
  }
  .flecha-vuelta {
    fill: none;
    stroke: #f2d06b;
    stroke-width: 2;
    stroke-dasharray: 5 3;
  }
  .etiqueta-vuelta {
    fill: #f2d06b;
    font-family: "VT323", monospace;
    font-size: 15px;
  }

  /* Punto 9: por debajo de ~900px, una columna en el orden del flujo; las
     flechas (pensadas para 4 columnas) se ocultan en vez de recalcularse
     sobre un layout que no tiene sentido para ellas -- decisión
     documentada en mesa.js, `_recalcularFlechas`. */
  @media (max-width: 900px) {
    .mesa {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .carta[data-rol] {
      grid-column: auto;
      grid-row: auto;
    }
    .carta[data-rol="cartografo"] { order: 1; }
    .carta[data-rol="despiezador"] { order: 2; }
    .carta[data-rol="lector-de-pieza"] { order: 3; }
    .carta[data-rol="trazador"] { order: 4; }
    .carta[data-rol="redactor"] { order: 5; }
    .carta[data-rol="verificador"] { order: 6; }
    .carta[data-rol="novato"] { order: 7; }
    .flechas {
      display: none;
    }
  }

  /* Panel "Ahora" + Bitácora (puntos 5 y 6), lado a lado bajo la mesa. */
  .panel-bajo-mesa {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-family: "VT323", monospace;
    font-size: 18px;
    line-height: 1.25;
  }
  .panel-bajo-mesa > div {
    min-width: 220px;
    background: #1a2230;
    border: 1px solid #333c4a;
    border-radius: 4px;
    padding: 6px 8px;
    box-sizing: border-box;
  }
  .panel-ahora {
    flex: 1 1 220px;
  }
  .panel-bitacora {
    flex: 2 1 260px;
  }
  .panel-bajo-mesa h2 {
    margin: 0 0 4px;
    font-size: 16px;
    font-family: "Courier New", "DejaVu Sans Mono", monospace;
    color: #f2d06b;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .panel-bajo-mesa ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  #lista-ahora li {
    border-bottom: 1px solid #222a35;
    padding: 1px 0;
    word-break: break-word;
  }
  #lista-bitacora li {
    white-space: normal;
    word-break: break-word;
    border-bottom: 1px solid #222a35;
    padding: 1px 0;
  }

  /* Puertas del guardia (punto 7), franja abajo. */
  .puertas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .puerta {
    flex: 1 1 220px;
    background: #1a2230;
    border: 2px solid #333c4a;
    border-radius: 4px;
    padding: 6px 8px;
    box-sizing: border-box;
    font-family: "VT323", monospace;
    font-size: 15px;
  }
  .puerta--discontinua {
    border-style: dashed;
  }
  .puerta-titulo {
    font-family: "Courier New", "DejaVu Sans Mono", monospace;
    font-size: 13px;
    color: #8fd0e8;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .puerta-regla {
    color: #8fa0b8;
    font-size: 13px;
    margin: 2px 0;
  }
  .puerta-estado {
    word-break: break-word;
  }
  .puerta--roja {
    border-color: #c23b3b;
    box-shadow: 0 0 6px rgba(194, 59, 59, 0.5);
  }
  .puerta--roja .puerta-estado {
    color: #ff9ecb;
  }
  .puerta--ambar {
    border-color: #e8c84a;
    box-shadow: 0 0 6px rgba(232, 200, 74, 0.5);
  }
  .puerta--ambar .puerta-estado {
    color: #f2e08a;
  }

  .controles {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    width: 100%;
  }
  .controles button {
    background: #1a2230;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 4px 8px;
    font-family: inherit;
    cursor: pointer;
  }
  .controles button.activo {
    border-color: #f2d06b;
    color: #f2d06b;
  }
  .controles input[type="range"] {
    flex: 1 1 auto;
    min-width: 80px;
  }
  .aviso-directo {
    width: 100%;
    text-align: center;
    color: #e8c84a;
  }
  .aviso-directo a {
    color: #8fd0e8;
  }
  .panel-lateral {
    position: fixed;
    top: 0;
    right: 0;
    width: min(360px, 100vw);
    height: 100vh;
    background: #141b24;
    border-left: 1px solid #333c4a;
    padding: 8px;
    box-sizing: border-box;
    overflow: auto;
  }
  .panel-lateral button {
    background: #1a2230;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 2px 8px;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .panel-lateral pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }
  /* Punto 9: sin scroll horizontal desde 1280px -- nada aquí fija un ancho
     mayor que 100vw; `main` tiene max-width: 1200px y la rejilla usa `fr`,
     no px fijos. */

  /* Formulario de lanzar (D21, Tarea 15): sin cambios. */
  .form-lanzar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 8px;
    margin-bottom: 10px;
    background: #1a2230;
    border: 1px solid #333c4a;
    border-radius: 4px;
  }
  .form-lanzar label {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .form-lanzar input[type="text"] {
    width: 340px;
    max-width: 100%;
  }
  .form-lanzar input[type="number"] {
    width: 64px;
  }
  .form-lanzar input,
  .form-lanzar button {
    background: #0b0f14;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 3px 6px;
    font-family: inherit;
    font-size: inherit;
  }
  .form-lanzar button {
    cursor: pointer;
  }
  .form-lanzar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .form-lanzar .error-lanzar {
    width: 100%;
    color: #ff6b6b;
  }
  /* D33: "Esta noche" -- la cola de la portada. */
  .cola-noche {
    padding: 8px;
    margin-bottom: 10px;
    background: #1a2230;
    border: 1px solid #333c4a;
    border-radius: 4px;
  }
  .cola-noche h2 {
    margin: 0 0 6px;
    font-size: 1em;
    text-transform: uppercase;
    color: #9fb4cc;
  }
  .cola-noche ul {
    margin: 0 0 6px;
    padding-left: 18px;
  }
  .cola-noche .vacia {
    color: #7d8a9a;
  }
  .cola-noche .detalle {
    color: #9fb4cc;
  }
  .cola-noche .btn-sacar {
    background: #0b0f14;
    color: #e8e0c8;
    border: 1px solid #333c4a;
    border-radius: 3px;
    padding: 0 6px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
  }
  .cola-noche .fallida {
    color: #ff9ecb;
  }
  .form-lanzar .texto-peso {
    width: 100%;
    color: #9fb4cc;
  }
  .form-lanzar .texto-peso.no-cabe {
    color: #ff6b6b;
  }
  .form-lanzar .ok-encolar {
    width: 100%;
    color: #8fd18f;
  }
  #btn-parar {
    background: #3a1e1e;
    color: #ff9ecb;
    border: 1px solid #5a2a2a;
    border-radius: 3px;
    padding: 4px 8px;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<header id="cabecera" class="cabecera"></header>

<main>
  <!-- D21 (Tarea 15). La rellena/gobierna mesa.js
       (`_instalarFormularioLanzar`). "falso" empieza marcado a propósito
       (gastar de verdad es la excepción, no el default). -->
  <form id="form-lanzar" class="form-lanzar">
    <label>repo <input id="f-repo" type="text" placeholder="URL de GitHub o ruta local" /></label>
    <label>tope $ <input id="f-tope" type="number" value="5" min="0" max="10" step="0.5" /></label>
    <label>vueltas <input id="f-vueltas" type="number" value="2" min="0" max="3" /></label>
    <label><input id="f-falso" type="checkbox" checked /> falso (sin gastar)</label>
    <button id="btn-pesar" type="button">Pesar</button>
    <button id="btn-lanzar" type="submit">Lanzar ahora</button>
    <button id="btn-encolar" type="button">Encolar para esta noche</button>
    <span id="error-lanzar" class="error-lanzar"></span>
    <span id="ok-encolar" class="ok-encolar"></span>
    <span id="texto-peso" class="texto-peso"></span>
  </form>

  <!-- D33: la cola de la noche (D29). La rellena mesa.js (`_cargarCola`). -->
  <section id="cola-noche" class="cola-noche">
    <h2>Esta noche</h2>
    <div id="cola-contenido">cargando…</div>
  </section>

  <div id="lista-runs" class="lista-runs"></div>

  <!-- D22: la mesa de papeles sustituye a la escena de D20 (un único
       <canvas> con personajes) por esta rejilla de tarjetas HTML + overlay
       SVG de flechas. mesa.js construye el contenido de #mesa y #puertas
       por JS (mismo patrón que ya usaba escena.js para la cabecera/lista de
       runs), así que aquí solo hacen falta los contenedores. -->
  <div id="zona-mesa" class="zona-mesa" hidden>
    <div id="controles" class="controles">
      <button id="btn-pausa" type="button">Pausa</button>
      <button type="button" data-vel="1">×1</button>
      <button type="button" data-vel="4">×4</button>
      <button type="button" data-vel="16">×16</button>
      <input id="barra" type="range" min="0" max="0" value="0" />
    </div>

    <div id="aviso-directo" class="aviso-directo" hidden></div>

    <!-- D21 (Tarea 15): solo visible en modo directo mientras no haya
         llegado run_fin -- lo gobierna _arrancarDirecto. -->
    <button id="btn-parar" type="button" hidden>Parar</button>

    <div class="mesa-wrap">
      <div id="mesa" class="mesa"></div>
      <svg id="flechas" class="flechas"></svg>
    </div>

    <div class="panel-bajo-mesa">
      <div class="panel-ahora">
        <h2>Ahora</h2>
        <ul id="lista-ahora"></ul>
      </div>
      <div class="panel-bitacora">
        <h2>Bitácora</h2>
        <ul id="lista-bitacora"></ul>
      </div>
    </div>

    <div id="puertas" class="puertas"></div>
  </div>
</main>

<aside id="panel-lateral" class="panel-lateral" hidden>
  <button id="cerrar-panel" type="button">cerrar</button>
  <pre id="panel-contenido"></pre>
</aside>

<script type="module">
  import { arrancar } from "/static/mesa.js";
  arrancar(document.getElementById("mesa"), document.getElementById("cabecera"));
</script>
</body>
</html>
